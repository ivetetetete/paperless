<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paperless - Sticky Notes</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar" class="interactive">
    <span class="toolbar-title">Paperless</span>
    <button id="btn-new-note" title="Crear nueva nota">+ Nueva Nota</button>
    <button id="btn-toggle-visibility" class="is-visible" title="Ocultar notas" aria-label="Mostrar u ocultar notas">
      <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
        <line x1="2" x2="22" y1="2" y2="22"/>
      </svg>
    </button>
    <button id="btn-history" title="Historial de notas" aria-label="Historial de notas">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M12 7v5l4 2"/>
      </svg>
      <span id="history-badge" class="history-badge" style="display: none;">0</span>
    </button>
    <button id="btn-quit" title="Cerrar aplicación">✕</button>
  </div>

  <div id="history-panel" class="history-panel interactive" style="display: none;">
    <div class="history-panel-header">
      <span class="history-panel-title">Historial de notas</span>
      <div class="history-panel-actions">
        <button id="btn-snapshot-all" class="history-action-btn" title="Guardar copia actual en el historial">+ Guardar copia</button>
        <button id="btn-clear-history" class="history-action-btn danger" title="Vaciar todo el historial">Vaciar</button>
      </div>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>

  <div id="notes-container"></div>

  <div id="slash-menu" class="slash-menu interactive" style="display: none;">
    <div class="slash-menu-header">Comandos básicos</div>
    <div id="slash-menu-list" class="slash-menu-list"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
